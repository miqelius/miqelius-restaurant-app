let category="all";
let lang=localStorage.getItem('table-lang')||'ka';if(!T[lang])lang='ka';let cart;try{cart=JSON.parse(localStorage.getItem('savane-restaurant-cart-v1')||'null')}catch{}if(!Array.isArray(cart)||cart.length!==ITEMS.length||cart.some(x=>!Number.isInteger(x)||x<0||x>99))cart=ITEMS.map(()=>0);const prices=ITEMS.map(x=>x.price);let mode='order';const modal=document.getElementById('modal');
function setLang(l){lang=l;localStorage.setItem('table-lang',l);document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=T[l][e.dataset.t]);['ka','ru','en'].forEach(x=>document.getElementById(x).classList.toggle('active',x===l));document.querySelectorAll('#theme option').forEach((o,i)=>o.textContent=T[l].themes[i]);T[l].item=ITEMS.map(x=>x.names[l]);renderDishes();update();}

function renderDishes(){const t=T[lang];document.getElementById('filters').innerHTML=Object.keys(t.categories).map(c=>`<button type="button" class="${c===category?'active':''}" onclick="category='${c}';renderDishes()">${t.categories[c]}</button>`).join('');document.getElementById('dishes').innerHTML=ITEMS.map((x,i)=>category==='all'||x.cat===category?`<div class="dish"><img loading="lazy" src="${x.photo}" alt="${x.names[lang]}" onerror="this.hidden=true"><article><p class="eyebrow">${t.categories[x.cat]}</p><h3>${x.names[lang]}</h3><div class="price"><b>${x.price.toFixed(2)} ₾</b><button onclick="add(${i},1)" aria-label="${t.add}: ${x.names[lang]}">+</button></div></article></div>`:'').join('')}
function setTheme(value){document.body.classList.toggle('brown',value==='brown');document.body.classList.toggle('dark',value==='rose');document.getElementById('theme').value=value;localStorage.setItem('table-theme',value)}
function update(){document.getElementById('count').textContent=cart.reduce((a,b)=>a+b,0);document.getElementById('total').textContent=cart.reduce((a,b,i)=>a+b*prices[i],0);localStorage.setItem('savane-restaurant-cart-v1',JSON.stringify(cart))}
function add(i,n){cart[i]=Math.max(0,Math.min(99,cart[i]+n));update();if(modal.open&&mode==='order'){const list=document.getElementById('cartRows');if(list)list.innerHTML=cartRows();document.getElementById('sum').textContent=document.getElementById('total').textContent;document.getElementById('sendBtn').disabled=!cart.some(Boolean)}}
function cartRows(){return cart.map((q,i)=>q?`<div class="row"><div>${T[lang].item[i]}<div class="note">${q*prices[i]} ₾</div></div><div class="qty"><button type="button" onclick="add(${i},-1)">−</button>${q}<button type="button" onclick="add(${i},1)">+</button></div></div>`:'').join('')||`<p>${T[lang].empty}</p>`}
function field(id,label,type='text',extra=''){return `<label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" ${extra}>`}
function openCart(){mode='order';showForm()}function reserve(){mode='booking';showForm()}
function showForm(){const t=T[lang];modalContent.innerHTML=`<h2>${mode==='order'?t.cart:t.booking}</h2>${mode==='booking'?`<p class="note booking-help">${t.bookingHelp}</p>`:''}${mode==='order'?`<div id="cartRows">${cartRows()}</div><p><b>${t.total}: <span id="sum">${total.textContent}</span> ₾</b></p>`:''}<form id="requestForm">${field('customer',t.name,'text','required maxlength="80" autocomplete="name"')}${field('phone',t.phone,'tel','required minlength="6" maxlength="30" autocomplete="tel"')}${mode==='order'?`<label for="fulfil">${t.type}</label><select id="fulfil" onchange="document.getElementById('addressWrap').hidden=this.value!=='delivery';document.getElementById('address').required=this.value==='delivery'"><option value="take">${t.take}</option><option value="delivery">${t.delivery}</option></select><div id="addressWrap" hidden>${field('address',t.addr,'text','maxlength="250" autocomplete="street-address"')}</div>`:guestPickerUI()}${mode==='booking'?bookingDateUI():field('when',t.time,'datetime-local','required')}${mode==='order'?`<label for="channel">Contact channel</label><select id="channel"><option value="whatsapp">WhatsApp</option><option value="viber">Viber</option><option value="messenger">Messenger</option></select>`:""}<label for="notes">${t.notes}</label><textarea id="notes" maxlength="500" rows="2"></textarea><p class="note">${t.notice}</p><p class="toast" role="status" id="status"></p><button class="primary submit" id="sendBtn" ${mode==='order'&&!cart.some(Boolean)?'disabled':''}>${t.send}</button></form>`;const now=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);if(mode==='booking'){selectDay('today');syncGuests(false)}else document.getElementById('when').min=now;document.getElementById('requestForm').onsubmit=send;if(!modal.open)modal.showModal()}
function send(e){e.preventDefault();const t=T[lang],v=id=>document.getElementById(id).value.trim();if(new Date(v('when')).getTime()<=Date.now()||!Number.isFinite(new Date(v('when')).getTime())){document.getElementById('status').textContent=t.past;return}if(mode==='order'&&!cart.some(Boolean))return;let lines=[CONFIG.restaurant,mode==='order'?t.cart:t.booking,t.name+': '+v('customer'),t.phone+': '+v('phone'),t.time+': '+v('when').replace('T',' ')];if(mode==='order'){cart.forEach((q,i)=>{if(q)lines.push(`${t.item[i]} × ${q} — ${q*prices[i]} GEL`)});lines.push(t.total+': '+total.textContent+' GEL',t.type+': '+t[document.getElementById('fulfil').value]);if(document.getElementById('fulfil').value==='delivery')lines.push(t.addr+': '+v('address'))}else lines.push(t.guests+': '+v('guests'));if(v('notes'))lines.push(t.notes+': '+v('notes'));lines.push(t.notice);const message=lines.join('\n');const channel=document.getElementById('channel')?.value||'whatsapp';let target='';if(channel==='whatsapp'&&/^\\d{8,15}$/.test(CONFIG.whatsapp))target='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(message);else if(channel==='viber')target='viber://chat?number=%2B995592078078';else if(channel==='messenger')target='https://m.me/miqelius88';if(target){window.open(target,'_blank','noopener')}else{const preview=document.createElement('textarea');preview.className='request-preview';preview.readOnly=true;preview.value=message;preview.setAttribute('aria-label',t.requestText);document.getElementById('status').replaceChildren(document.createTextNode(t.copyNote),preview);if(navigator.clipboard)navigator.clipboard.writeText(message).catch(()=>{});preview.select();}}


function guestPickerUI(){const t=T[lang];return `<label for="guests">${t.guests}</label><div class="guest-stepper"><button type="button" id="guestMinus" onclick="changeGuests(-1)" aria-label="${t.guestLess}">−</button><input id="guests" name="guests" type="number" inputmode="numeric" min="1" max="50" step="1" value="2" required aria-describedby="guestHelp" oninput="syncGuests(false)" onblur="syncGuests(true)"><button type="button" id="guestPlus" onclick="changeGuests(1)" aria-label="${t.guestMore}">+</button></div><div class="guest-presets" role="group" aria-label="${t.guests}">${[2,4,6,8,10].map(n=>`<button type="button" data-guests="${n}" onclick="chooseGuests(${n})" aria-pressed="${n===2}">${n}</button>`).join('')}</div><p id="guestHelp" class="note">${t.guestHelp}</p>`}
function syncGuests(normalize){const el=document.getElementById('guests');if(!el)return;let n=el.valueAsNumber;const valid=Number.isInteger(n)&&n>=1&&n<=50;if(normalize&&el.value!==''&&Number.isFinite(n)){n=Math.max(1,Math.min(50,Math.round(n)));el.value=String(n)}const ok=Number.isInteger(n)&&n>=1&&n<=50;el.setCustomValidity(ok?'':T[lang].guestInvalid);document.getElementById('guestMinus').disabled=ok&&n===1;document.getElementById('guestPlus').disabled=ok&&n===50;document.querySelectorAll('[data-guests]').forEach(b=>{const on=ok&&Number(b.dataset.guests)===n;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))})}
function chooseGuests(n){document.getElementById('guests').value=String(n);syncGuests(false)}
function changeGuests(delta){const el=document.getElementById('guests');const current=el.valueAsNumber;chooseGuests(Math.max(1,Math.min(50,(Number.isFinite(current)?Math.round(current):2)+delta)))}

function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function bookingDateUI(){const t=T[lang];return `<label>${t.date}</label><div class="day-choices">${['today','tomorrow','other'].map(x=>`<button type="button" id="day-${x}" onclick="selectDay('${x}')">${t[x]}</button>`).join('')}</div><div class="date-grid"><div id="calendarWrap" hidden>${field('bookDate',t.date,'date','onchange="syncBooking()"')}</div><div>${field('bookTime',t.hour,'time','required onchange="syncBooking()"')}</div></div><input type="hidden" id="when"><p class="note" id="selectedDate"></p>`}
function selectDay(day){const d=new Date();if(day==='tomorrow')d.setDate(d.getDate()+1);const date=document.getElementById('bookDate');date.min=localDate(new Date());if(day!=='other'||!date.value)date.value=localDate(d);document.getElementById('calendarWrap').hidden=day!=='other';date.required=day==='other';document.querySelectorAll('.day-choices button').forEach(b=>{const selected=b.id==='day-'+day;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',selected)});syncBooking()}
function syncBooking(){const d=document.getElementById('bookDate').value,t=document.getElementById('bookTime').value;document.getElementById('when').value=d&&t?d+'T'+t:'';document.getElementById('selectedDate').textContent=d?(lang==='ka'?d.split('-').reverse().join('.'):new Date(d+'T12:00:00').toLocaleDateString(lang==='ru'?'ru-RU':'en-GB',{weekday:'long',month:'long',day:'numeric'})):''}
setLang(lang);setTheme(localStorage.getItem('table-theme')||'brown');
</script></body></html>
